# Render Blueprint — deploy the StudySphere AI backend as a persistent web service.
# Usage: push this repo to GitHub, then on render.com choose
# "New +" -> "Blueprint" and point it at this repo. Render reads this file automatically.
services:
  - type: web
    name: studysphere-ai-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: APP_SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: "https://api.openai.com/v1"
      - key: LLM_MODEL
        value: "gpt-4o-mini"
      - key: EMBEDDING_MODEL
        value: "text-embedding-3-small"
      - key: DATABASE_URL
        value: "sqlite:///./studysphere.db"
    disk:
      name: studysphere-data
      mountPath: /opt/render/project/src/backend
      sizeGB: 1
